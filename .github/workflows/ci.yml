name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: school_ci
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      NODE_ENV: test
      WEB_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      API_PORT: 3001
      DATABASE_URL: postgresql://school:school_ci@127.0.0.1:5432/school_ci
      SESSION_COOKIE_NAME: school_session
      SESSION_TTL_DAYS: 30
      APP_ENCRYPTION_KEY: ci-app-encryption-key-change-me-000000000000
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-change-me-000000000000
      STORAGE_DIR: ${{ github.workspace }}/storage-ci
      STRICT_ORIGIN_CHECK_ENABLED: "true"
      SECURITY_HEADERS_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_HASH_KEY: ci-rate-limit-hash-key-change-me-000000000000
      LOG_LEVEL: log
      LOG_HASH_KEY: ci-log-hash-key-change-me-000000000000
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ci-metrics-token-change-me-0000000000000000
      TRUST_PROXY_HOPS: 1
      SMOKE_TEST_RATE_LIMIT: "true"
      SEED_ADMIN_EMAIL: admin@ci.local
      SEED_ADMIN_PASSWORD: change-me-ci-admin
      SEED_MANAGER_EMAIL: manager@ci.local
      SEED_MANAGER_PASSWORD: change-me-ci-manager
      SEED_DEVELOPMENT_DATA: "false"
      E2E_ALLOW_SEED: "true"
      E2E_ADMIN_EMAIL: e2e-admin@ci.local
      E2E_ADMIN_PASSWORD: change-me-e2e-admin-ci
      E2E_MANAGER_EMAIL: e2e-manager@ci.local
      E2E_MANAGER_PASSWORD: change-me-e2e-manager-ci
      E2E_TEACHER_EMAIL: e2e-teacher@ci.local
      E2E_TEACHER_PASSWORD: change-me-e2e-teacher-ci
      E2E_PARENT_EMAIL: e2e-parent@ci.local
      E2E_PARENT_PASSWORD: change-me-e2e-parent-ci
      E2E_STUDENT_EMAIL: e2e-student@ci.local
      E2E_STUDENT_PASSWORD: change-me-e2e-student-ci
      PAYMENT_PROVIDER: NONE
      PAYMENT_DEFAULT_PROVIDER: MONO
      LIQPAY_ENABLED: "true"
      MONO_ENABLED: "true"
      LIQPAY_PUBLIC_KEY: ci_liqpay_public
      LIQPAY_PRIVATE_KEY: ci_liqpay_private_key_for_e2e_only
      LIQPAY_CALLBACK_URL: http://127.0.0.1:3001/api/integrations/payments/liqpay/callback
      LIQPAY_RESULT_URL: http://127.0.0.1:3000/parent/payments
      LIQPAY_API_URL: http://127.0.0.1:3099/api/request
      LIQPAY_CHECKOUT_URL: https://www.liqpay.ua/api/3/checkout
      LIQPAY_MOCK_PORT: 3099
      MONO_TOKEN: ci_mono_token
      MONO_WEBHOOK_URL: http://127.0.0.1:3001/api/integrations/payments/mono/webhook
      MONO_RESULT_URL: http://127.0.0.1:3000/parent/payments
      MONO_API_URL: http://127.0.0.1:3100
      MONO_MOCK_PORT: 3100
      RELEASE_SHA: ci-v31
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: 120

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Release dependency preflight
        run: node scripts/release-preflight.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Static repository checks
        run: pnpm verify:static

      - name: Build database package
        run: pnpm db:build

      - name: Apply all migrations to fresh PostgreSQL
        run: pnpm db:migrate

      - name: Seed minimum CI identities
        run: pnpm db:seed

      - name: Seed E2E role fixtures
        run: pnpm db:seed:e2e


      - name: Backup / restore drill
        shell: bash
        run: |
          mkdir -p test-results/backups
          POSTGRES_TOOL_MODE=docker BACKUP_DIR="$PWD/test-results/backups" bash scripts/backup-postgres.sh
          BACKUP_FILE="$(ls -1t test-results/backups/school-*.dump | head -1)"
          POSTGRES_TOOL_MODE=docker BACKUP_FILE="$BACKUP_FILE" bash scripts/verify-postgres-backup.sh
          docker run --rm --network host postgres:17-alpine psql \
            postgresql://school:school_ci@127.0.0.1:5432/postgres \
            -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS school_restore_ci"
          docker run --rm --network host postgres:17-alpine psql \
            postgresql://school:school_ci@127.0.0.1:5432/postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE school_restore_ci"
          POSTGRES_TOOL_MODE=docker BACKUP_FILE="$BACKUP_FILE" \
            RESTORE_DATABASE_URL=postgresql://school:school_ci@127.0.0.1:5432/school_restore_ci \
            CONFIRM_RESTORE=RESTORE bash scripts/restore-postgres.sh
          MIGRATION_COUNT="$(docker run --rm --network host postgres:17-alpine psql \
            postgresql://school:school_ci@127.0.0.1:5432/school_restore_ci -Atc 'SELECT count(*) FROM school_migrations')"
          EXPECTED_MIGRATION_COUNT="$(find packages/db/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          test "$MIGRATION_COUNT" -eq "$EXPECTED_MIGRATION_COUNT"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production builds
        run: pnpm build

      - name: Start API and web
        shell: bash
        run: |
          mkdir -p test-results/runtime
          node tests/e2e/liqpay-mock.mjs > test-results/runtime/liqpay-mock.log 2>&1 &
          echo $! > /tmp/school-liqpay-mock.pid
          node tests/e2e/mono-mock.mjs > test-results/runtime/mono-mock.log 2>&1 &
          echo $! > /tmp/school-mono-mock.pid
          pnpm --filter @school/api start > test-results/runtime/api.log 2>&1 &
          echo $! > /tmp/school-api.pid
          node apps/worker/dist/main.js > test-results/runtime/worker.log 2>&1 &
          echo $! > /tmp/school-worker.pid
          pnpm --filter @school/web start > test-results/runtime/web.log 2>&1 &
          echo $! > /tmp/school-web.pid
          for i in {1..45}; do
            API_OK=0
            WEB_OK=0
            LIQPAY_OK=0
            MONO_OK=0
            WORKER_OK=0
            curl -fsS http://127.0.0.1:3001/api/health/ready >/dev/null && API_OK=1 || true
            curl -fsS http://127.0.0.1:3000/login >/dev/null && WEB_OK=1 || true
            curl -fsS http://127.0.0.1:3099/health >/dev/null && LIQPAY_OK=1 || true
            curl -fsS http://127.0.0.1:3100/health >/dev/null && MONO_OK=1 || true
            curl -fsS http://127.0.0.1:3001/api/health/worker >/dev/null && WORKER_OK=1 || true
            if [ "$API_OK" = "1" ] && [ "$WEB_OK" = "1" ] && [ "$LIQPAY_OK" = "1" ] && [ "$MONO_OK" = "1" ] && [ "$WORKER_OK" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "API or web did not become ready"
          cat test-results/runtime/api.log || true
          cat test-results/runtime/web.log || true
          cat test-results/runtime/worker.log || true
          cat test-results/runtime/liqpay-mock.log || true
          cat test-results/runtime/mono-mock.log || true
          exit 1


      - name: Production security smoke
        run: pnpm smoke:production

      - name: Staging API / worker parity smoke
        run: pnpm smoke:staging

      - name: API role E2E
        run: pnpm e2e:api

      - name: Reset deterministic E2E state before browser flow
        run: pnpm db:seed:e2e

      - name: Browser role E2E
        run: pnpm e2e:web

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/school-api.pid ]; then kill "$(cat /tmp/school-api.pid)" || true; fi
          if [ -f /tmp/school-web.pid ]; then kill "$(cat /tmp/school-web.pid)" || true; fi
          if [ -f /tmp/school-worker.pid ]; then kill "$(cat /tmp/school-worker.pid)" || true; fi
          if [ -f /tmp/school-liqpay-mock.pid ]; then kill "$(cat /tmp/school-liqpay-mock.pid)" || true; fi
          if [ -f /tmp/school-mono-mock.pid ]; then kill "$(cat /tmp/school-mono-mock.pid)" || true; fi

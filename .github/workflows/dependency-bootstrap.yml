name: Dependency Bootstrap

on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Generate lockfile from package manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Frozen install proof
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        env:
          RELEASE_ALLOW_UNTRACKED_LOCKFILE: "true"
        run: pnpm release:preflight

      - name: Static repository checks
        run: pnpm verify:static

      - name: Dependency security audit
        run: pnpm release:deps:audit

      - name: Dependency graph evidence
        run: pnpm release:deps:evidence

      - name: Ensure bootstrap changed only the lockfile
        shell: bash
        run: |
          STATUS="$(git status --porcelain --untracked-files=all)"
          EXTRA="$(printf '%s\n' "$STATUS" | grep -vE '^[ MARC?]{2} pnpm-lock\.yaml$' | grep -v '^$' || true)"
          if [ -n "$EXTRA" ]; then
            echo "Dependency bootstrap unexpectedly modified files other than pnpm-lock.yaml:" >&2
            echo "$EXTRA" >&2
            exit 1
          fi
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git diff -- pnpm-lock.yaml > artifacts/pnpm-lock.patch
          else
            git diff --no-index -- /dev/null pnpm-lock.yaml > artifacts/pnpm-lock.patch || test $? -eq 1
          fi

      - name: Upload reviewed-lockfile bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pnpm-lockfile-${{ github.sha }}
          path: |
            pnpm-lock.yaml
            artifacts/pnpm-lock.patch
            artifacts/dependency-audit.json
            artifacts/dependency-audit.raw.json
            artifacts/dependency-evidence.json
          if-no-files-found: error

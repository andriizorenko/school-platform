name: Dependency Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dependency-bootstrap.yml"
      - "scripts/create-dependency-evidence.mjs"
      - "scripts/audit-dependencies.mjs"
      - "scripts/check-integration.mjs"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Generate lockfile from package manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Frozen install proof
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        env:
          RELEASE_ALLOW_UNTRACKED_LOCKFILE: "true"
        run: pnpm release:preflight

      - name: Static repository checks
        run: pnpm verify:static

      - name: Dependency security audit
        id: dependency_audit
        continue-on-error: true
        run: pnpm release:deps:audit

      - name: Dependency graph evidence
        if: always()
        run: pnpm release:deps:evidence

      - name: Ensure bootstrap changed only the lockfile
        if: always()
        shell: bash
        run: |
          STATUS="$(git status --porcelain --untracked-files=all)"
          EXTRA="$(printf '%s\n' "$STATUS" | grep -vE '^[ MARC?]{2} pnpm-lock\.yaml$' | grep -vE '^\?\? artifacts/' | grep -v '^$' || true)"
          if [ -n "$EXTRA" ]; then
            echo "Dependency bootstrap unexpectedly modified files other than pnpm-lock.yaml/artifacts:" >&2
            echo "$EXTRA" >&2
            exit 1
          fi
          mkdir -p artifacts
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git diff -- pnpm-lock.yaml > artifacts/pnpm-lock.patch
          else
            git diff --no-index -- /dev/null pnpm-lock.yaml > artifacts/pnpm-lock.patch || test $? -eq 1
          fi

      - name: Upload reviewed-lockfile bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pnpm-lockfile-${{ github.sha }}
          path: |
            pnpm-lock.yaml
            artifacts/pnpm-lock.patch
            artifacts/dependency-audit.json
            artifacts/dependency-audit.raw.json
            artifacts/dependency-evidence.json
            artifacts/dependency-list.raw.json
            artifacts/dependency-list.stderr.txt
          if-no-files-found: warn

      - name: Enforce dependency audit gate
        if: steps.dependency_audit.outcome == 'failure'
        shell: bash
        run: |
          echo "Dependency audit failed. Evidence was uploaded for review." >&2
          exit 1

      - name: Publish reviewed lockfile branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "school-platform-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B bootstrap/pnpm-lockfile
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already matches the committed source tree."
            exit 0
          fi
          git commit -m "Commit reviewed pnpm lockfile"
          git push --force origin HEAD:refs/heads/bootstrap/pnpm-lockfile
